name: Daily Data Collection

on:
  schedule:
    # 매일 오후 9시 KST (12:00 UTC) — 한국 증시 마감(15:30) + 당일 데이터 확정 이후
    - cron: "0 12 * * *"
  workflow_dispatch:  # 수동 실행 (API key 신규 등록 후 즉시 테스트 가능)

permissions:
  contents: write     # data/ 폴더를 레포에 커밋하기 위해 필요

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 모든 수집기는 API key 불필요 (yfinance·CoinGecko·alternative.me·
      # Open-Meteo·GDELT·Hacker News·Google Trends)

      # ── 1. 시장 데이터 (주식·환율·원자재·암호화폐·공포탐욕지수) ───────
      - name: Collect Markets
        run: python src/collect_markets.py
        continue-on-error: true

      # ── 2. 감성·트렌드 (Hacker News·GDELT 뉴스·Google Trends) ───────
      - name: Collect Sentiment & Trends
        run: python src/collect_sentiment.py
        continue-on-error: true

      # ── 3. 환경 데이터 (날씨·대기질, Open-Meteo) ────────────────────
      - name: Collect Environment
        run: python src/collect_environment.py
        continue-on-error: true

      # ── 수집된 data/ 폴더를 레포에 커밋 ─────────────────────────────
      - name: Commit collected data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet \
            && echo "No new data to commit" \
            || git commit -m "data: daily collection $(date -u +%Y-%m-%d)"
          git push
