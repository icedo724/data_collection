name: Daily Data Collection

on:
  schedule:
    # 매일 오후 9시 KST (12:00 UTC) — 한국 증시 마감(15:30) + 당일 데이터 확정 이후
    - cron: "0 12 * * *"
  workflow_dispatch:  # 수동 실행 (API key 신규 등록 후 즉시 테스트 가능)

permissions:
  contents: write     # data/ 폴더를 레포에 커밋하기 위해 필요

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 1. 시장 데이터 (주식·환율·원자재·암호화폐) ───────────────────
      # API key 불필요 — yfinance + CoinGecko 무료
      - name: Collect Markets
        run: python src/collect_markets.py
        continue-on-error: true

      # ── 2. 감성·트렌드 (Reddit·뉴스·Google Trends·Naver DataLab) ────
      - name: Collect Sentiment & Trends
        env:
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          NEWS_API_KEY:         ${{ secrets.NEWS_API_KEY }}
          NAVER_CLIENT_ID:      ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:  ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python src/collect_sentiment.py
        continue-on-error: true

      # ── 3. 환경 데이터 (날씨·대기질·유가) ───────────────────────────
      - name: Collect Environment
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          OPINET_API_KEY:      ${{ secrets.OPINET_API_KEY }}
        run: python src/collect_environment.py
        continue-on-error: true

      # ── 4. 공공 데이터 (지하철·버스·한국은행 거시지표) ───────────────
      - name: Collect Public Data
        env:
          SEOUL_DATA_API_KEY: ${{ secrets.SEOUL_DATA_API_KEY }}
          BOK_API_KEY:        ${{ secrets.BOK_API_KEY }}
        run: python src/collect_public.py
        continue-on-error: true

      # ── 수집된 data/ 폴더를 레포에 커밋 ─────────────────────────────
      - name: Commit collected data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet \
            && echo "No new data to commit" \
            || git commit -m "data: daily collection $(date -u +%Y-%m-%d)"
          git push
